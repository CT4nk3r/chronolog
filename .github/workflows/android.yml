name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Configure signing via Gradle properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p ~/.gradle
          {
            echo "android.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore"
            echo "android.injected.signing.store.password=${KEYSTORE_PASSWORD}"
            echo "android.injected.signing.key.alias=${KEY_ALIAS}"
            echo "android.injected.signing.key.password=${KEY_PASSWORD}"
          } >> ~/.gradle/gradle.properties

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f android/app/release.keystore
          mkdir -p ~/.gradle
          touch ~/.gradle/gradle.properties
          sed -i '/android.injected.signing/d' ~/.gradle/gradle.properties

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ChronoLog-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
